[project]
name = "owl-sam-segment"
version = "1.0.0"
description = "Prompt-free, label-free object finding and counting: OWLv2 finds objects, SAM outlines them, with a Gradio viewer."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    # pinned: engine.py uses SAM post-processing helpers from this exact version
    "transformers==4.44.2",
    "huggingface_hub>=0.24,<1.0",
    "gradio>=4.44,<6",
    "pillow>=10",
    "numpy<2",
    "openvino>=2024.4",
    "scipy>=1.11",  # OWLv2 image preprocessing
]

[tool.uv]
package = true

# Linux: CUDA build (NVIDIA GPU, falls back to the CPU without one); Windows/macOS: CPU build + OpenVINO
[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlseg"]
